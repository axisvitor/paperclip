    - Adaptar menções, stickers e elementos que dependem do Instagram.
    - Conferir proporção, cortes, margens e leitura no Status.
    - Registrar o arquivo e a revisão efetivamente entregues.
    note: O pedido de reaproveitamento seleciona a variante; a aprovação do Story original não aprova automaticamente
      uma adaptação.
