  new_channel_process: Quando o usuário solicitar outra rede, registrar o canal e definir formatos, parâmetros de
    exportação, adaptações e critérios de revisão antes de produzir para ele.
  story_reuse:
    decision_field: reuse_on_whatsapp_status
    default: false
    source_content_and_revision_required: true
    create_linked_variant: true
    independent_review_required: true
    preserve_unaffected_source: true
    checks:
